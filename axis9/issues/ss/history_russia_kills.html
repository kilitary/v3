<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>history_russia_kills</title>
    <style>
        /* Kid-fest colors on a white terminal-style background */
        body {
            font-family: ui-monospace, 'Cascadia Code', 'Fira Code', 'SFMono-Regular', 'Menlo', 'Consolas', 'Ubuntu Mono', 'Source Code Pro', monospace;
            line-height: 1.6;
            max-width: 960px;
            margin: 0 auto;
            padding: 30px;
            background: #ffffff;
            color: #222;
            overflow-x: hidden;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: ui-monospace, 'Cascadia Code', 'Fira Code', 'SFMono-Regular', 'Menlo', 'Consolas', 'Ubuntu Mono', 'Source Code Pro', monospace;
            font-weight: 800;
            letter-spacing: 0.03em;
            margin-top: 1.2em;
            margin-bottom: 0.6em;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.08);
        }
        a {
            color: #2E7D32;
            text-decoration:  dotted #7B61FF;
            text-decoration-thickness: 2px;
            transition: all 0.2s ease;
        }
        a:hover {
            transform: scale(1.05) rotate(1deg);
            color: #7B61FF;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
        }
        p {
            margin: 0.8em 0;
        }
        ul, ol {
            margin: 0.5em 0;
            padding-left: 1.8em;
        }
        li {
            margin: 0.3em 0;
        }
        blockquote {
            border-left: 6px solid #B660A6;
            padding: 0.4em 1.2em;
            margin: 1em 0;
            background: #fafafa;
            font-style: italic;
            border-radius: 0 8px 8px 0;
        }
        code {
            background: #fafafa;
            padding: 0.15em 0.5em;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #1A535C;
        }
        pre {
            background: #fafafa;
            padding: 1em;
            border-radius: 8px;
            overflow-x: auto;
            border: 3px dotted #9B5DE8;
        }
        pre code {
            background: transparent;
            padding: 0;
            color: inherit;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 1em 0;
        }
        th {
            background: #ffffff;
            padding: 8px 12px;
            border: 2px solid #416EB4;
            font-weight: bold;
        }
        td {
            padding: 8px 12px;
            border: 1px dashed #B660A6;
        }
        tr:nth-child(odd) td {
            background: #ffffff;
        }
        tr:nth-child(even) td {
            background: #fafafa;
        }
        hr {
            border: 4px solid #416EB4;
            background: transparent;
            margin: 1.5em 0;
            border-radius: 2px;
        }
        img {
            max-width: 90%;
            border: 6px solid #7B61FF;
            border-radius: 12px;
            margin: 1em 0;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1.5em;
            padding: 8px 16px;
            background: #ffffff;
            border-radius: 20px;
            color: #1A535C;
            font-weight: bold;
        }
        .confetti {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="confetti" id="confetti"></div>
    <a href="javascript:history.back()" class="back-link">← history_russia_kills</a>
    <blockquote style="border-color:#C70039;">
<p style="color:#6A0572;">лента сводок по питеру</p>
</blockquote>
<ol>

<li style="color:#843b62;">каждодневные пиздилки/убийства на почве пидор/мужик</li>
</ol>

<!-- DBBAFADE -->
    <script>
        // Sprinkle animated confetti that matches the kid-fest palette
        (function() {
            const colors = ["#9B5DE8","#7B61FF","#843b62","#B660A6","#416EB4","#6A0572","#2E7D32"];
            const confetti = document.getElementById('confetti');
            const count = 120;
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                const size = Math.random() * 8 + 4;
                el.style.cssText =
                    'position:absolute;left:'+Math.random()*100+'vw+top:'+Math.random()*100+'vh+'+
                    'width:'+size+'px;height:'+size+'px;background:'+colors[Math.floor(Math.random()*colors.length)]+
                    ';border-radius:'+(Math.random()>0.5?'50%':'0')+';'+
                    'animation:float '+Math.random()*5+3+'s linear infinite;opacity:0.7';
                el.style.transform = 'rotate('+Math.random()*360+'deg)';
                confetti.appendChild(el);
            }
            const style = document.createElement('style');
            style.textContent = '@keyframes float { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(-120px) rotate(720deg); } }';
            document.head.appendChild(style);
        })();
    </script>
</body>
</html>
